<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGENRO IMS | Visitors Log access</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf4ef;color:#173e30;font:16px/1.6 system-ui,sans-serif}main{box-sizing:border-box;width:min(540px,calc(100% - 40px));padding:32px;background:white;border:1px solid #cfe0d5;border-radius:18px}h1{font-size:28px;margin:0 0 12px}a{color:#087a56;font-weight:700}</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="../shared/supabase.js?v=20261107-attendance-only"></script>
</head><body data-requires-auth="admin"><main><h1>Visitors Log</h1><p id="accessMessage" role="status">Checking administrator access…</p><a href="homepage.html">Back to your workspace</a></main>
<script>document.addEventListener('DOMContentLoaded',async()=>{
 try {
  if(!window.PGENRO_API?.requireAdmin)throw new Error('The account service is unavailable.');
  await window.PGENRO_API.requireAdmin();
  location.replace('../admin/visitors-admin.html');
 }catch(error){
  document.getElementById('accessMessage').textContent='Visitors Log is available to administrators only.';
  if(error?.code==='PGENRO_ADMIN_REQUIRED')location.replace('homepage.html');
 }
},{once:true});</script></body></html>

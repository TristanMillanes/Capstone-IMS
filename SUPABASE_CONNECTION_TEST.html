<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PGENRO IMS • Supabase Connection Test</title>
  <link rel="stylesheet" href="supabase-test.css?v=20260913-clean">
  

<link rel="stylesheet" href="shared/diagnostic.css?v=20260913-clean2">
</head>
<body class="pgenro-user">
<main>
  <h1>Supabase Connection Test</h1>
  <p class="muted">This checks the same shared connection used by the PGENRO admin and user pages.</p>
  <div class="row"><span id="sdkDot" class="dot wait"></span><div><strong>Supabase SDK</strong><div id="sdkText" class="muted">Checking…</div></div></div>
  <div class="row"><span id="cfgDot" class="dot wait"></span><div><strong>Project configuration</strong><div id="cfgText" class="muted">Checking…</div></div></div>
  <div class="row"><span id="apiDot" class="dot wait"></span><div><strong>Database API</strong><div id="apiText" class="muted">Checking…</div></div></div>
  <button id="retry" type="button">Run test again</button>
  <div id="details" class="msg">Waiting for test…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./shared/supabase.js"></script>
<script>
  const setState=(id,text,ok)=>{document.getElementById(id+'Dot').className='dot '+(ok===true?'ok':ok===false?'bad':'wait');document.getElementById(id+'Text').textContent=text};
  async function run(){
    setState('sdk', window.PGENRO_SUPABASE?.sdkReady ? 'SDK loaded.' : 'SDK failed to load.', !!window.PGENRO_SUPABASE?.sdkReady);
    setState('cfg', window.PGENRO_SUPABASE?.configured ? 'Project URL and publishable key are configured.' : 'Publishable key is still missing.', !!window.PGENRO_SUPABASE?.configured);
    const details=document.getElementById('details');
    if(!window.PGENRO_API){setState('api','Shared client did not initialize.',false);details.textContent='Check shared/supabase.js.';return;}
    const result=await window.PGENRO_API.testConnection();
    setState('api',result.message,result.ok);
    details.textContent = result.ok ? 'CONNECTED\nProject: zssrxubajhqryrwijyzm\nURL: https://zssrxubajhqryrwijyzm.supabase.co' : 'NOT CONNECTED\n'+result.message;
  }
  document.getElementById('retry').addEventListener('click',run);
  run();
</script>
  <script src="./shared/pgenro-global.js?v=20260912"></script>
<script src="shared/workspace.js?v=20260913"></script>
<script src="shared/ui-fixes.js?v=20260913-ui2"></script>
</body>
</html>
